<!DOCTYPE html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark" data-a11y-animated-images="system">
  <head>
    <meta charset="utf-8" />
    <title>面试小助手</title>
    <script type="text/javascript" src="js/clipboard/clipboard.min.js"></script>
    <style>
        body{
            font-size: 14px;
        }
        textarea{
            width: 400px;
            height: 200px;
        }
    </style>
  </head>
  <body>
    <textarea id="in"></textarea>
    <button onclick="exe()">处理</button>
    <button class='cpbtn' style='margin-left:20px;display: none;' data-clipboard-text=''>复制</button>
    <textarea id="out"></textarea>
    <hr/>
    <div>技术栈：<input id="jsz" value="SpringCloud,Java,Mysql,小程序,Redis,JVM,多线程,微服务,Linux"/></div>
    <div>程度：<input id="cd" value="了解A,熟悉A,有一定A经验,使用过A"/></div>
    <div id="selDiv"></div>
    <div><button onclick="pj()">生成</button></div>
    <div><textarea id="pj"></textarea></div>
  </body>
  <script type="application/javascript">
    function exe(){
        const inEl = document.getElementById("in");
        if(!inEl) return;
        let txt= inEl.value;
        console.log(txt);
        let txts = txt.split("\n");
        console.log(txts);
        let out = "";
        out += txts[1].split("：")[1].replace("面试","")+"你好";
        out += txts[2].split("：")[1].split(" ")[1].split("-")[0]+"的面试，";
        out += txts[7];
        out += " ，链接："+txts[5];
        const outEl = document.getElementById("out");
        if(outEl) outEl.value = out;
        //刷新复制按钮
        document.querySelectorAll(".cpbtn").forEach(btn => btn.setAttribute("data-clipboard-text", out));
        setTimeout(function(){
            document.querySelectorAll(".cpbtn").forEach(btn => btn.click());
        },200);
    }
    function init(){
        const jszEl = document.getElementById("jsz");
        const cdEl = document.getElementById("cd");
        if(!jszEl || !cdEl) return;
        let jsz = jszEl.value;
        let cd = cdEl.value;
        let jszs = jsz.split(",");
        let cds = cd.split(",");
        let html = "";
        for(let i = 0;i<jszs.length;i++){
            html+="<div style='margin-bottom:4px;'><span style='text-align:right;width:100px;display:inline-block'>"+jszs[i]+"</span>:";
            for(let j = 0;j<cds.length;j++){
                html+="<input type='radio' name='n"+i+"' value='"+cds[j]+"'/>"+cds[j];
            }
            html+="</div>"
        }
        const selDiv = document.getElementById("selDiv");
        if(selDiv) selDiv.innerHTML = html;
    }
    function pj(){
        const divs = document.querySelectorAll("#selDiv div");
        let out="";
        for(let i = 0;i<divs.length;i++){
            const span = divs[i].querySelector("span");
            const input = divs[i].querySelector("input[name=n"+i+"]:checked");
            if(!span || !input) continue;
            let txt = span.innerHTML;
            let cd = input.value;
            if(cd){
                cd = cd.replace("A",txt);
                out += cd+",";
            }
        }
        const pjEl = document.getElementById("pj");
        if(pjEl) pjEl.value = out;
    }
    init();
    var clipboard = new Clipboard('.cpbtn');
  </script>
</html>
